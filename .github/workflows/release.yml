name: Publish versioned release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must contain a semantic version such as 0.3.0."
          }

          [xml]$project = Get-Content src/DraftLedger.App/DraftLedger.App.csproj
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -ne $version) {
            throw "VERSION ($version) does not match the application version ($projectVersion)."
          }

          if ((Get-Content docs/RELEASE-NOTES.md -Raw) -notmatch [regex]::Escape($version)) {
            throw "Release notes do not mention version $version."
          }

      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Increment VERSION before publishing again."
          }

          gh release create $tag artifacts/DraftLedger-win-x64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DraftLedger $version" --notes-file docs/RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed."
          }
